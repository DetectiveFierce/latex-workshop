server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Docker can replace a service container without restarting this proxy. Resolve
  # service names at request time so nginx does not retain the replaced IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3001;
  set $language_service_upstream http://language-service:3002;

  # The Mind Palace edge proxy strips the public /latex-workshop prefix. Serve
  # these stripped SPA routes directly; redirecting them back to the public prefix
  # would loop when the edge proxy handles the redirected request.
  location = /oauth/consent {
    try_files /index.html =404;
  }

  location = /auth {
    try_files /index.html =404;
  }

  location = /latex-workshop/oauth/consent {
    try_files /index.html =404;
  }

  location = /latex-workshop/auth {
    try_files /index.html =404;
  }
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /health/live {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  # The application is built for its production subpath. Keep the standalone
  # container usable for browser tests and direct access by normalizing that
  # public prefix before static-file and API routing.
  location ^~ /latex-workshop/ {
    rewrite ^/latex-workshop/(.*)$ /$1 last;
  }

  location ~ ^/api/v1/projects/[^/]+/lsp$ {
    proxy_pass $language_service_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 900s;
  }

  location /api/ {
    client_max_body_size 260m;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # OAuth/MCP discovery is rooted at the public origin by RFC 8414 and RFC 9728.
  location ^~ /.well-known/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|mjs|css|woff2|svg|png)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
