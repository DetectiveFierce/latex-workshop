worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  # OAuth query strings can contain authorization codes. Do not log them.
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8090;
    server_name _;
    client_max_body_size 12m;
    set $api_upstream http://latex-workshop-api-1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Public ingress must never inherit the private transport's owner identity.
    proxy_set_header X-Workshop-Tunnel-Key "";
    proxy_set_header X-Workshop-Tailnet-Key "";
    proxy_set_header Tailscale-User-Login "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health/live { return 200 'ok'; }
    location ^~ /latex-workshop/ {
      rewrite ^/latex-workshop/(.*)$ /$1 last;
    }
    location = /api/mcp {
      proxy_pass $api_upstream;
    }
    location ~ ^/\.well-known/(oauth-protected-resource|oauth-authorization-server)(/|$) {
      proxy_pass $api_upstream;
    }
    location ~ ^/api/auth/(\.well-known/(oauth-authorization-server|openid-configuration)|oauth2/(authorize|token|register|revoke|userinfo)|jwks)$ {
      proxy_pass $api_upstream;
    }
    # The website, account login, REST API, private MCP route, and storage stay private.
    location / { return 404; }
  }
}
