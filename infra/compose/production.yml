name: latex-workshop-production

x-runtime-env: &runtime-env
  NODE_ENV: production
  WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
  API_ORIGIN: ${API_ORIGIN:?set API_ORIGIN}
  API_PORT: 3001
  LSP_PORT: 3002
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-latex-workshop}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
  COMPILE_IMAGE: ${COMPILE_IMAGE:?set immutable COMPILE_IMAGE}
  COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-60000}

services:
  migrate:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    command: ['packages/db/node_modules/.bin/tsx', 'packages/db/src/migrate.ts']
    environment: *runtime-env
    restart: 'no'

  api:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    command: ['node', 'apps/api/dist/server.js']
    environment: *runtime-env
    expose: ['3001']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/health/ready']
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
    deploy:
      replicas: 2
      update_config: { order: start-first, failure_action: rollback }

  language-service:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    command: ['node', 'apps/language-service/dist/index.js']
    environment: *runtime-env
    expose: ['3002']
    stop_grace_period: 30s
    deploy: { replicas: 2 }

  compile-worker:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    command: ['node', 'apps/compile-worker/dist/index.js']
    user: '10001:10001'
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID}
    environment:
      <<: *runtime-env
      HOME: /tmp
      TMPDIR: ${COMPILE_WORK_DIR:?set COMPILE_WORK_DIR}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${COMPILE_WORK_DIR:?set COMPILE_WORK_DIR}:${COMPILE_WORK_DIR:?set COMPILE_WORK_DIR}
    stop_grace_period: 90s
    deploy:
      replicas: 2
      placement:
        constraints: ['node.labels.latex-worker == true']

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    expose: ['80']
    read_only: true
    tmpfs: ['/var/cache/nginx', '/var/run']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health/live']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { replicas: 2 }
