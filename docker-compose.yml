name: latex-workshop

x-app-env: &app-env
  NODE_ENV: development
  WEB_ORIGIN: http://localhost:5173
  API_ORIGIN: http://localhost:3001
  API_PORT: 3001
  LSP_PORT: 3002
  DATABASE_URL: postgres://latex:latex@postgres:5432/latex_workshop
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: latex-workshop
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_FORCE_PATH_STYLE: 'true'
  AUTH_SECRET: local-development-secret-change-before-production
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: LaTeX Workshop <noreply@localhost>
  COMPILE_IMAGE: latex-workshop-texlive:latest

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: latex
      POSTGRES_PASSWORD: latex
      POSTGRES_DB: latex_workshop
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ['5433:5432']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U latex -d latex_workshop'],
        interval: 3s,
        timeout: 3s,
        retries: 20,
      }

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 3s, timeout: 3s, retries: 20 }

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    volumes: [minio-data:/data]
    ports: ['9000:9000', '9001:9001']
    healthcheck:
      {
        test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live'],
        interval: 3s,
        timeout: 3s,
        retries: 20,
      }

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ['1025:1025', '8025:8025']

  texlive-image:
    image: latex-workshop-texlive:latest
    build: { context: ./infra/texlive }
    command: ['true']

  api:
    build: { context: ., dockerfile: Dockerfile.services, target: runtime }
    command: ['sh', '-c', 'pnpm db:migrate && node apps/api/dist/server.js']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_started }
    ports: ['3001:3001']

  compile-worker:
    build: { context: ., dockerfile: Dockerfile.services, target: runtime }
    command: ['node', 'apps/compile-worker/dist/index.js']
    environment: *app-env
    volumes: ['/var/run/docker.sock:/var/run/docker.sock', '/tmp:/tmp']
    depends_on:
      api: { condition: service_started }
      texlive-image: { condition: service_completed_successfully }

  language-service:
    build: { context: ., dockerfile: Dockerfile.services, target: runtime }
    command: ['node', 'apps/language-service/dist/index.js']
    environment: *app-env
    depends_on: { api: { condition: service_started } }
    ports: ['3002:3002']

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on:
      api: { condition: service_started }
      language-service: { condition: service_started }
    ports: ['5173:80']

volumes:
  postgres-data:
  redis-data:
  minio-data:
