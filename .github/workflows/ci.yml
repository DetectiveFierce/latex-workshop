name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: latex
          POSTGRES_PASSWORD: latex
          POSTGRES_DB: latex_workshop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U latex -d latex_workshop"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://latex:latex@localhost:5432/latex_workshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm check
      - run: pnpm db:migrate

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: docker compose up -d --build
      - name: Wait for application
        run: timeout 240 sh -c 'until curl -fsS http://localhost:3001/health/ready && curl -fsS http://localhost:5173; do sleep 3; done'
      - run: pnpm test:e2e
      - if: always()
        run: docker compose logs --no-color > docker-compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            docker-compose.log
            playwright-report
            test-results
